name: Theme quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, automation/continuous-development]

permissions:
  contents: read

concurrency:
  group: slateframe-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate theme metadata and JSON
        run: |
          php -r '$j=json_decode(file_get_contents("theme.json"),true,512,JSON_THROW_ON_ERROR); if (($j["version"] ?? null)!==3) { throw new RuntimeException("theme.json must use version 3"); }'
          php -r '$s=file_get_contents("style.css"); foreach (["Theme Name: Slateframe","Author: hsxk","Tested up to: 7.1","Text Domain: slateframe"] as $needle) { if (!str_contains($s,$needle)) { throw new RuntimeException("Missing metadata: ".$needle); } }'
      - name: Validate release metadata consistency
        run: php bin/check-release-metadata.php
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/theme.js
          node --check playwright.config.js
          find tests/browser -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/browser/test-visual-evidence-helper.cjs
          node tests/browser/test-visual-evidence-helper.cjs
          node tests/browser/test-wordpress-login.cjs
          node tests/browser/test-editor-login-helper.cjs
          node tests/browser/test-color-cookie-scope.cjs
          node tests/browser/test-footer-widget-fixture.cjs
      - name: Validate build script syntax
        run: bash -n bin/build-theme-zip.sh
      - name: Validate screenshot PNG and corruption regression
        run: |
          python3 bin/check-screenshot.py screenshot.png
          python3 -m unittest discover -s tests -p "test_*.py"
      - name: Guard native Core TOC targets and plugin-neutral CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/verify_core_toc_css.py
          test -f tests/test_verify_core_toc_css.py
          test -f tests/test_reading_css_contract.py
      - name: Guard public namespace and language-agnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_files < <(find . -type f \( -name '*.php' -o -name '*.css' -o -name '*.js' -o -name 'theme.json' \) -not -path './.git/*' -not -path './.github/*' -not -path './tests/*')
          if grep -niE 'time2log|t2l-|--t2l-|time2log_|/zh/|/ja/|/en/|pll_current_language|pll_the_languages' "${runtime_files[@]}"; then
            echo 'Site-specific identifiers, locale paths, or required plugin APIs must not ship in Slateframe runtime.' >&2
            exit 1
          fi
      - name: Validate patterns and required files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patterns=(patterns/*.php)
          test "${#patterns[@]}" -ge 22
          for file in "${patterns[@]}"; do
            grep -q '^ \* Title:' "$file"
            grep -q '^ \* Slug: slateframe/' "$file"
            grep -q '^ \* Categories:.*slateframe' "$file"
          done
          for file in patterns/photo-essay.php patterns/photography-contact-sheet.php patterns/photography-diptych.php patterns/photography-sequence.php; do
            grep -q '"imageCrop":false' "$file"
          done
          if grep -E 'class="[^"]* is-cropped( |")' patterns/photo-essay.php patterns/photography-contact-sheet.php patterns/photography-diptych.php patterns/photography-sequence.php; then
            echo 'Natural-ratio photography patterns must not serialize Core cropped galleries.' >&2
            exit 1
          fi
          if grep -niE 'https?://' "${patterns[@]}"; then
            echo 'Production patterns must not introduce remote media or third-party requests.' >&2
            exit 1
          fi
          for file in style.css readme.txt LICENSE .distignore assets/css/core-buttons.css assets/css/core-comments-pagination.css assets/css/core-navigation.css assets/css/core-post-navigation.css assets/css/core-video.css assets/css/core-audio.css assets/css/core-embed.css assets/css/core-rss.css assets/css/core-latest-posts.css assets/css/core-latest-comments.css assets/css/core-categories.css assets/css/core-archives.css assets/css/core-tag-cloud.css assets/css/core-page-list.css assets/css/core-post-terms.css assets/css/core-post-comments-link.css assets/css/core-comments-title.css assets/css/core-comments-thread.css assets/css/core-post-comments-count.css assets/css/core-query-no-results.css assets/css/core-post-comments-form.css assets/css/core-file.css assets/css/core-loginout.css assets/css/core-post-date.css assets/css/core-post-author-name.css assets/css/core-post-author-biography.css assets/css/core-avatar.css assets/css/core-image.css assets/css/core-table.css assets/css/core-heading.css assets/css/core-paragraph.css assets/css/core-list.css inc/core-list.php tests/browser/core-list-parity.spec.js assets/css/core-verse.css inc/core-verse.php tests/browser/core-verse-parity.spec.js tests/browser/appearance-breakpoint-matrix.spec.js docs/APPEARANCE-BREAKPOINT-MATRIX.md assets/css/core-site-logo.css assets/css/core-site-title.css assets/css/core-site-tagline.css assets/css/core-columns.css assets/css/core-group.css assets/css/core-details.css assets/css/core-separator.css assets/css/core-quote.css assets/css/core-pullquote.css assets/css/core-post-excerpt.css assets/css/core-read-more.css assets/css/core-post-title.css assets/css/core-post-featured-image.css assets/css/navigation.css assets/css/footer.css assets/css/forms.css assets/css/form-content.css assets/css/search-form.css assets/css/comments.css assets/css/reading.css assets/css/photography.css assets/css/content-modes.css assets/css/portfolio-reflow.css assets/css/empty-state.css index.php functions.php theme.json rtl.css template-parts/content-card.php template-parts/content-none.php inc/template-tags.php inc/customizer.php package.json playwright.config.js .github/workflows/photography.yml tests/browser/theme.spec.js tests/browser/appearance.spec.js tests/browser/photography-raster-lightbox.spec.js tests/browser/color-mode.spec.js tests/browser/editor.spec.js tests/fixtures/showcase.html bin/build-theme-zip.sh bin/check-release-metadata.php bin/check-pattern-runtime.php phpcs.xml.dist; do test -f "$file"; done
      - name: Enforce asset budgets
        run: |
          wc -c style.css assets/css/core-buttons.css assets/css/navigation.css assets/css/footer.css assets/css/forms.css assets/css/form-content.css assets/css/search-form.css assets/css/comments.css assets/css/reading.css assets/css/publishing.css assets/css/photography.css assets/css/content-modes.css assets/css/query-loop.css assets/css/portfolio-reflow.css assets/css/empty-state.css assets/css/editor.css assets/js/theme.js
          test "$(grep -Fo 'var(--slateframe-border-width) solid var(--slateframe-border)' style.css | wc -l | tr -d ' ')" -eq 1
          if grep -FRq 'var(--slateframe-border-width) solid var(--slateframe-border)' assets/css; then
            echo 'Component styles must consume --slateframe-rule instead of rebuilding the semantic border.' >&2
            exit 1
          fi
          test $(wc -c < style.css) -le 16000
          # Scoped Core Button CSS is a separate, tightly capped block asset.
          test $(wc -c < assets/css/portfolio-reflow.css) -le 260
          test $(wc -c < assets/css/core-buttons.css) -le 400
          test $(wc -c < assets/css/core-navigation.css) -le 850
          test $(wc -c < assets/css/core-tabs.css) -le 550
          test $(wc -c < assets/css/core-accordion.css) -le 800
          test $(wc -c < assets/css/core-post-navigation.css) -le 550
          test $(wc -c < assets/css/core-video.css) -le 350
          test $(wc -c < assets/css/core-audio.css) -le 350
          test $(wc -c < assets/css/core-embed.css) -le 350
          test $(wc -c < assets/css/core-rss.css) -le 600
          test $(wc -c < assets/css/core-comments-pagination.css) -le 650
          test $(wc -c < assets/css/core-latest-posts.css) -le 500
          test $(wc -c < assets/css/core-latest-comments.css) -le 550
          test $(wc -c < assets/css/core-categories.css) -le 550
          test $(wc -c < assets/css/core-archives.css) -le 550
          test $(wc -c < assets/css/core-tag-cloud.css) -le 400
          test $(wc -c < assets/css/core-page-list.css) -le 500
          test $(wc -c < assets/css/core-post-terms.css) -le 450
          test $(wc -c < assets/css/core-post-comments-link.css) -le 380
          test $(wc -c < assets/css/core-comments-title.css) -le 240
          test $(wc -c < assets/css/core-comments-thread.css) -le 900
          test $(wc -c < assets/css/core-post-comments-count.css) -le 240
          test $(wc -c < assets/css/core-query-no-results.css) -le 360
          test $(wc -c < assets/css/core-post-comments-form.css) -le 850
          test $(wc -c < assets/css/core-file.css) -le 400
          test $(wc -c < assets/css/core-loginout.css) -le 750
          test $(wc -c < assets/css/core-post-date.css) -le 400
          test $(wc -c < assets/css/core-post-author-name.css) -le 400
          test $(wc -c < assets/css/core-post-author-biography.css) -le 180
          test $(wc -c < assets/css/core-avatar.css) -le 400
          test $(wc -c < assets/css/core-image.css) -le 220
          test $(wc -c < assets/css/core-table.css) -le 600
          test $(wc -c < assets/css/core-heading.css) -le 900
          test $(wc -c < assets/css/core-paragraph.css) -le 300
          test $(wc -c < assets/css/core-list.css) -le 350
          test $(wc -c < assets/css/core-verse.css) -le 220
          test $(wc -c < assets/css/core-site-logo.css) -le 400
          test $(wc -c < assets/css/core-site-title.css) -le 400
          test $(wc -c < assets/css/core-site-tagline.css) -le 240
          test $(wc -c < assets/css/core-columns.css) -le 240
          test $(wc -c < assets/css/core-group.css) -le 240
          test $(wc -c < assets/css/core-details.css) -le 400
          test $(wc -c < assets/css/core-separator.css) -le 280
          test $(wc -c < assets/css/core-quote.css) -le 450
          test $(wc -c < assets/css/core-pullquote.css) -le 440
          test $(wc -c < assets/css/core-post-excerpt.css) -le 480
          test $(wc -c < assets/css/core-read-more.css) -le 300
          test $(wc -c < assets/css/core-post-title.css) -le 400
          test $(wc -c < assets/css/core-post-featured-image.css) -le 400
          test $(wc -c < assets/css/navigation.css) -le 4000
          test $(wc -c < assets/css/footer.css) -le 2000
          test $(wc -c < assets/css/forms.css) -le 1300
          test $(wc -c < assets/css/form-content.css) -le 750
          test $(wc -c < assets/css/search-form.css) -le 300
          test $(wc -c < assets/css/comments.css) -le 3000
          test $(wc -c < assets/css/reading.css) -le 7000
          test $(wc -c < assets/css/publishing.css) -le 4500
          test $(wc -c < assets/css/photography.css) -le 6000
          test $(wc -c < assets/css/content-modes.css) -le 7000
          test $(wc -c < assets/css/query-loop.css) -le 3000
          test $(wc -c < assets/css/empty-state.css) -le 1000
          test $(wc -c < assets/css/editor.css) -le 5000
          test $(wc -c < assets/js/theme.js) -le 7000
          if grep -Eq '100(d?v|v)w' assets/css/reading.css; then
            echo 'Reading primitives must stay container-relative; viewport-width escapes recreate legacy child-theme overflow.' >&2
            exit 1
          fi
          base_runtime_bytes=$(( $(wc -c < style.css) + $(wc -c < assets/css/navigation.css) + $(wc -c < assets/css/footer.css) + $(wc -c < assets/js/theme.js) ))
          forms_runtime_bytes=$(( base_runtime_bytes + $(wc -c < assets/css/forms.css) ))
          search_runtime_bytes=$(( forms_runtime_bytes + $(wc -c < assets/css/search-form.css) ))
          empty_state_runtime_bytes=$(( search_runtime_bytes + $(wc -c < assets/css/empty-state.css) ))
          core_reading_runtime_bytes=$(( base_runtime_bytes + $(wc -c < assets/css/reading.css) ))
          publishing_runtime_bytes=$(( core_reading_runtime_bytes + $(wc -c < assets/css/publishing.css) ))
          authored_form_runtime_bytes=$(( publishing_runtime_bytes + $(wc -c < assets/css/forms.css) + $(wc -c < assets/css/form-content.css) ))
          discussion_runtime_bytes=$(( publishing_runtime_bytes + $(wc -c < assets/css/forms.css) + $(wc -c < assets/css/comments.css) ))
          authored_form_discussion_bytes=$(( discussion_runtime_bytes + $(wc -c < assets/css/form-content.css) ))
          photography_runtime_bytes=$(( publishing_runtime_bytes + $(wc -c < assets/css/photography.css) ))
          photography_discussion_bytes=$(( photography_runtime_bytes + $(wc -c < assets/css/forms.css) + $(wc -c < assets/css/comments.css) ))
          contextual_runtime_bytes=$(( publishing_runtime_bytes + $(wc -c < assets/css/content-modes.css) ))
          contextual_discussion_bytes=$(( contextual_runtime_bytes + $(wc -c < assets/css/forms.css) + $(wc -c < assets/css/comments.css) ))
          portfolio_runtime_bytes=$(( contextual_runtime_bytes + $(wc -c < assets/css/query-loop.css) ))
          portfolio_discussion_bytes=$(( portfolio_runtime_bytes + $(wc -c < assets/css/forms.css) + $(wc -c < assets/css/comments.css) ))
          echo "Base CSS+navigation+JS: ${base_runtime_bytes} bytes"
          echo "Base+shared forms runtime: ${forms_runtime_bytes} bytes"
          echo "Search form runtime: ${search_runtime_bytes} bytes"
          echo "Empty-state search runtime: ${empty_state_runtime_bytes} bytes"
          echo "Base+core reading runtime: ${core_reading_runtime_bytes} bytes"
          echo "Base+reading+publishing runtime: ${publishing_runtime_bytes} bytes"
          echo "Authored form runtime: ${authored_form_runtime_bytes} bytes"
          echo "Base+reading+publishing+discussion runtime: ${discussion_runtime_bytes} bytes"
          echo "Authored form+discussion runtime: ${authored_form_discussion_bytes} bytes"
          echo "Photography runtime: ${photography_runtime_bytes} bytes"
          echo "Photography runtime+discussion: ${photography_discussion_bytes} bytes"
          echo "Base+reading+publishing+content-mode runtime: ${contextual_runtime_bytes} bytes"
          echo "Base+reading+publishing+content-mode+discussion runtime: ${contextual_discussion_bytes} bytes"
          echo "Portfolio runtime with Query Loop layer: ${portfolio_runtime_bytes} bytes"
          echo "Portfolio runtime with Query Loop layer+discussion: ${portfolio_discussion_bytes} bytes"
          test "$base_runtime_bytes" -le 25000
          test "$forms_runtime_bytes" -le 24500
          test "$search_runtime_bytes" -le 24800
          test "$empty_state_runtime_bytes" -le 25000
          test "$core_reading_runtime_bytes" -le 30000
          test "$publishing_runtime_bytes" -le 34500
          test "$authored_form_runtime_bytes" -le 35500
          test "$discussion_runtime_bytes" -le 37500
          test "$authored_form_discussion_bytes" -le 38000
          test "$photography_runtime_bytes" -le 40000
          test "$photography_discussion_bytes" -le 43000
          test "$contextual_runtime_bytes" -le 42000
          test "$contextual_discussion_bytes" -le 45000
          test "$portfolio_runtime_bytes" -le 45000
          test "$portfolio_discussion_bytes" -le 48000

  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install WPCS and run PHPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress 'wp-coding-standards/wpcs:^3.4'
          "$(composer global config bin-dir --absolute)/phpcs" --standard=phpcs.xml.dist --report=full .



  compatibility:
    name: Compatibility · WP ${{ matrix.wordpress }} · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.7'
            php: '7.4'
          - wordpress: '6.7'
            php: '8.3'
          - wordpress: 'latest'
            php: '7.4'
          - wordpress: 'latest'
            php: '8.3'
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb --protocol=tcp --host=127.0.0.1 --user=root --password=root --database=wordpress --execute='SHOW ENGINE INNODB STATUS' >/dev/null"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      - name: Install WP-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
      - name: Install WordPress and activate Slateframe
        shell: bash
        run: |
          set -euo pipefail
          site="/tmp/wp-compat-${{ matrix.wordpress }}-${{ matrix.php }}"
          mkdir -p "$site"
          bash bin/retry-wp-core-download.sh --path="$site" --version="${{ matrix.wordpress }}"
          wp config create --path="$site" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$site" --url=http://127.0.0.1:8080 --title=Slateframe --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" "$site/wp-content/themes/slateframe"
          wp theme activate slateframe --path="$site"
          test "$(wp option get stylesheet --path="$site")" = slateframe
          wp eval 'if ( ! current_theme_supports("title-tag") || ! current_theme_supports("align-wide") ) { throw new RuntimeException("Required theme support missing."); }' --path="$site"

  theme-check:
    name: WordPress.org Theme Check
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb --protocol=tcp --host=127.0.0.1 --user=root --password=root --database=wordpress --execute='SHOW ENGINE INNODB STATUS' >/dev/null"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Build production theme
        run: ./bin/build-theme-zip.sh /tmp/slateframe-theme-check-dist
      - name: Install WordPress, Theme Check, and run submission checks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p /tmp/wp-theme-check
          bash bin/retry-wp-core-download.sh --path=/tmp/wp-theme-check --version=latest
          wp config create --path=/tmp/wp-theme-check --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw --path=/tmp/wp-theme-check
          wp core install --path=/tmp/wp-theme-check --url=http://127.0.0.1:8080 --title=Slateframe --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          unzip -q /tmp/slateframe-theme-check-dist/slateframe.zip -d /tmp/wp-theme-check/wp-content/themes
          wp theme activate slateframe --path=/tmp/wp-theme-check
          wp plugin install theme-check --activate --path=/tmp/wp-theme-check

          set +e
          wp theme-check run slateframe --format=json --path=/tmp/wp-theme-check > /tmp/slateframe-theme-check.json
          theme_check_exit=$?
          set -e
          cat /tmp/slateframe-theme-check.json

          php -r '
            $report = json_decode(file_get_contents("/tmp/slateframe-theme-check.json"), true, 512, JSON_THROW_ON_ERROR);
            $required = array_values(array_filter($report, static fn($item) => ($item["type"] ?? "") === "REQUIRED"));
            if ($required) {
                fwrite(STDERR, "Theme Check REQUIRED findings:\n" . json_encode($required, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
                exit(1);
            }
          '

          if [ "$theme_check_exit" -ne 0 ]; then
            echo "Theme Check reported advisory findings; no REQUIRED findings remain."
          fi
      - name: Attest exact-HEAD distributable
        shell: bash
        env:
          SLATEFRAME_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd /tmp/slateframe-theme-check-dist
          test -s slateframe.zip
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SLATEFRAME_EXPECTED_SHA"
          printf '%s\n' "$SLATEFRAME_EXPECTED_SHA" > HEAD_SHA.txt
          sha256sum slateframe.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload exact-HEAD distributable
        uses: actions/upload-artifact@v7
        with:
          name: slateframe-distribution
          path: |
            /tmp/slateframe-theme-check-dist/slateframe.zip
            /tmp/slateframe-theme-check-dist/HEAD_SHA.txt
            /tmp/slateframe-theme-check-dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload Theme Check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: slateframe-theme-check
          path: /tmp/slateframe-theme-check.json
          if-no-files-found: ignore
          retention-days: 7

