            }
            remove_theme_mod("slateframe_spacing_scale");
            remove_theme_mod("slateframe_content_width");

            set_theme_mod("slateframe_color_mode", "dark");
            $dark_editor = slateframe_editor_spatial_tokens(array("styles" => array()));
            $dark_css = $dark_editor["styles"][0]["css"] ?? "";
            foreach (array("--slateframe-bg:#111412", "--slateframe-text:#eef1ee", "color-scheme:dark") as $needle) {
              if (false === strpos($dark_css, $needle)) {
                throw new RuntimeException("Editor dark-mode token missing: " . $needle);
              }
            }
            remove_theme_mod("slateframe_color_mode");
          ' --path=/tmp/wp-site

