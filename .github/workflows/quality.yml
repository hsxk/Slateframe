name: Theme quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: slateframe-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate theme metadata and JSON
        run: |
          php -r '$j=json_decode(file_get_contents("theme.json"),true,512,JSON_THROW_ON_ERROR); if (($j["version"] ?? null)!==3) { throw new RuntimeException("theme.json must use version 3"); }'
          php -r '$s=file_get_contents("style.css"); foreach (["Theme Name: Slateframe","Text Domain: slateframe"] as $needle) { if (!str_contains($s,$needle)) { throw new RuntimeException("Missing metadata: ".$needle); } }'
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/theme.js
          node --check playwright.config.js
          node --check tests/browser/theme.spec.js
      - name: Guard public namespace and language-agnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_files < <(find . -type f \( -name '*.php' -o -name '*.css' -o -name '*.js' -o -name 'theme.json' \) -not -path './.git/*' -not -path './.github/*' -not -path './tests/*')
          if grep -niE 'time2log|t2l-|--t2l-|time2log_|/zh/|/ja/|/en/|pll_current_language|pll_the_languages' "${runtime_files[@]}"; then
            echo 'Site-specific identifiers, locale paths, or required plugin APIs must not ship in Slateframe runtime.' >&2
            exit 1
          fi
      - name: Validate patterns and required files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patterns=(patterns/*.php)
          test "${#patterns[@]}" -ge 8
          for file in "${patterns[@]}"; do
            grep -q '^ \* Title:' "$file"
            grep -q '^ \* Slug: slateframe/' "$file"
            grep -q '^ \* Categories:.*slateframe' "$file"
          done
          for file in style.css index.php functions.php theme.json rtl.css template-parts/content-card.php inc/template-tags.php package.json playwright.config.js tests/browser/theme.spec.js phpcs.xml.dist; do test -f "$file"; done
      - name: Enforce asset budgets
        run: |
          wc -c style.css assets/css/editor.css assets/js/theme.js
          test $(wc -c < style.css) -le 24000
          test $(wc -c < assets/css/editor.css) -le 5000
          test $(wc -c < assets/js/theme.js) -le 7000

  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install WPCS and run PHPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress 'wp-coding-standards/wpcs:^3.4'
          "$(composer global config bin-dir --absolute)/phpcs" --standard=phpcs.xml.dist --report=full .


  theme-check:
    name: WordPress.org Theme Check
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Install WordPress, Theme Check, and run submission checks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p /tmp/wp-theme-check
          wp core download --path=/tmp/wp-theme-check --version=latest
          wp config create --path=/tmp/wp-theme-check --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw --path=/tmp/wp-theme-check
          wp core install --path=/tmp/wp-theme-check --url=http://127.0.0.1:8080 --title=Slateframe --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-theme-check/wp-content/themes/slateframe
          wp theme activate slateframe --path=/tmp/wp-theme-check
          wp plugin install theme-check --activate --path=/tmp/wp-theme-check
          wp theme-check run slateframe --format=json --path=/tmp/wp-theme-check | tee /tmp/slateframe-theme-check.json
      - name: Upload Theme Check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: slateframe-theme-check
          path: /tmp/slateframe-theme-check.json
          if-no-files-found: ignore
          retention-days: 7

  wordpress-smoke:
    name: WordPress install and activation
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Install WP-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
      - name: Install WordPress and activate Slateframe
        run: |
          mkdir -p /tmp/wp-site
          wp core download --path=/tmp/wp-site --version=latest
          wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title=Slateframe --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-site/wp-content/themes/slateframe
          wp theme activate slateframe --path=/tmp/wp-site
          test "$(wp option get stylesheet --path=/tmp/wp-site)" = slateframe
          wp eval '$patterns=WP_Block_Patterns_Registry::get_instance(); foreach (["slateframe/photo-essay","slateframe/photography-contact-sheet","slateframe/project-case-study","slateframe/portfolio-index","slateframe/learning-path","slateframe/knowledge-outline","slateframe/editorial-note","slateframe/reading-list"] as $name) { if (!$patterns->is_registered($name)) { throw new RuntimeException($name); } }' --path=/tmp/wp-site
          wp eval '$styles=WP_Block_Styles_Registry::get_instance(); foreach ([["core/gallery","slateframe-contact-sheet"],["core/list","slateframe-steps"],["core/list","slateframe-checklist"],["core/group","slateframe-key-facts"],["core/columns","slateframe-ledger"]] as $style) { if (!$styles->is_registered($style[0],$style[1])) { throw new RuntimeException($style[0]."/".$style[1]); } }' --path=/tmp/wp-site

  browser-smoke:
    name: Browser smoke
    needs: [static]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixture site
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp && chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p /tmp/wp-browser
          wp core download --path=/tmp/wp-browser --version=latest
          wp config create --path=/tmp/wp-browser --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=/tmp/wp-browser --url=http://127.0.0.1:8080 --title='Slateframe Browser' --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-browser/wp-content/themes/slateframe
          wp theme activate slateframe --path=/tmp/wp-browser
          cat > /tmp/slateframe-browser-page.html <<'HTML'
          <!-- wp:paragraph {"className":"browser-default-prose"} -->
          <p class="browser-default-prose">Readable measure for Latin, 中文，以及長い日本語の文章。</p>
          <!-- /wp:paragraph -->

          <!-- wp:group {"align":"wide","className":"browser-wide-block"} -->
          <div class="wp-block-group alignwide browser-wide-block"><!-- wp:paragraph -->
          <p>A wide editorial block used to verify that layout can expand beyond the prose measure.</p>
          <!-- /wp:paragraph --></div>
          <!-- /wp:group -->

          <!-- wp:group {"align":"full","className":"browser-full-block"} -->
          <div class="wp-block-group alignfull browser-full-block"><!-- wp:paragraph -->
          <p>A full-width block used to verify the edge-to-edge publishing canvas.</p>
          <!-- /wp:paragraph --></div>
          <!-- /wp:group -->

          <!-- wp:table {"className":"browser-data-table is-style-slateframe-data"} -->
          <figure class="wp-block-table browser-data-table is-style-slateframe-data"><table><thead><tr><th>Metric</th><th>2026</th><th>2027</th></tr></thead><tbody><tr><td>Publishing reach</td><td>1,234</td><td>12,345</td></tr></tbody></table></figure>
          <!-- /wp:table -->

          <!-- wp:details {"className":"browser-details is-style-slateframe-disclosure"} -->
          <details class="wp-block-details browser-details is-style-slateframe-disclosure"><summary>Implementation note</summary><!-- wp:paragraph -->
          <p>Native disclosure content remains readable without JavaScript.</p>
          <!-- /wp:paragraph --></details>
          <!-- /wp:details -->

          <!-- wp:html -->
          <ol class="wp-block-footnotes browser-footnotes"><li id="browser-footnote">Footnote content with a <a href="#main-content">return link</a>.</li></ol>
          <!-- /wp:html -->

          <!-- wp:code -->
          <pre class="wp-block-code"><code>echo "slateframe";</code></pre>
          <!-- /wp:code -->

          <!-- wp:list {"ordered":true,"className":"browser-steps is-style-slateframe-steps"} -->
          <ol class="browser-steps is-style-slateframe-steps"><li>Understand the idea.</li><li>Apply it.</li><li>Extend it.</li></ol>
          <!-- /wp:list -->

          <!-- wp:list {"className":"browser-checklist is-style-slateframe-checklist"} -->
          <ul class="browser-checklist is-style-slateframe-checklist"><li>Keyboard-safe</li><li>Translation-safe</li></ul>
          <!-- /wp:list -->

          <!-- wp:group {"className":"browser-key-facts is-style-slateframe-key-facts"} -->
          <div class="wp-block-group browser-key-facts is-style-slateframe-key-facts"><!-- wp:heading {"level":3} --><h3 class="wp-block-heading">Key facts</h3><!-- /wp:heading --><!-- wp:paragraph --><p>Reusable editorial context.</p><!-- /wp:paragraph --></div>
          <!-- /wp:group -->
          HTML

          PAGE_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=page \
            --post_status=publish \
            --comment_status=open \
            --post_title='Slateframe 发布框架 — Ein außergewöhnlich langes Veröffentlichungsbeispiel' \
            --post_content="$(cat /tmp/slateframe-browser-page.html)" \
            --porcelain)

          CHILD_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=page \
            --post_status=publish \
            --post_parent="$PAGE_ID" \
            --post_title='Nested navigation page' \
            --post_content='<p>Nested fallback navigation fixture.</p>' \
            --porcelain)

          POST_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=post \
            --post_status=publish \
            --comment_status=open \
            --post_title='Slateframe Browser Post' \
            --post_content='<p>Browser smoke content.</p><blockquote><p>Editorial quote.</p></blockquote>' \
            --porcelain)

          wp comment create \
            --path=/tmp/wp-browser \
            --comment_post_ID="$PAGE_ID" \
            --comment_author='CI Reader' \
            --comment_author_email='ci-reader@example.com' \
            --comment_content='Page comment fixture.' \
            --comment_approved=1

          echo "SLATEFRAME_PAGE_PATH=/?page_id=$PAGE_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_POST_PATH=/?p=$POST_ID" >> "$GITHUB_ENV"
      - name: Install Playwright and start WordPress
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npx playwright install --with-deps chromium
          wp server --path=/tmp/wp-browser --host=127.0.0.1 --port=8080 >/tmp/slateframe-server.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
      - name: Run responsive browser smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npm run test:browser
      - name: Upload browser artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: slateframe-browser
          path: |
            test-artifacts/screenshots/
            playwright-report/
            test-results/
            /tmp/slateframe-server.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build distributable
    needs: [static, coding-standards, theme-check, wordpress-smoke, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          ./bin/build-theme-zip.sh
          unzip -Z1 dist/slateframe.zip > /tmp/package.txt
          grep -qx 'slateframe/style.css' /tmp/package.txt
          grep -qx 'slateframe/functions.php' /tmp/package.txt
          grep -qx 'slateframe/theme.json' /tmp/package.txt
          if grep -Eq '^slateframe/(package(-lock)?\.json|playwright\.config\.js|phpcs\.xml\.dist)$' /tmp/package.txt; then exit 1; fi
          if grep -E '^slateframe/(\.git|\.github|docs|bin|dist|node_modules|tests|test-artifacts|playwright-report|test-results)/' /tmp/package.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: slateframe-theme
          path: dist/slateframe.zip
          retention-days: 7
