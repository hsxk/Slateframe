name: Theme quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: slateframe-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate theme metadata and JSON
        run: |
          php -r '$j=json_decode(file_get_contents("theme.json"),true,512,JSON_THROW_ON_ERROR); if (($j["version"] ?? null)!==3) { throw new RuntimeException("theme.json must use version 3"); }'
          php -r '$s=file_get_contents("style.css"); foreach (["Theme Name: Slateframe","Author: Hao Kexin","Tested up to: 7.1","Text Domain: slateframe"] as $needle) { if (!str_contains($s,$needle)) { throw new RuntimeException("Missing metadata: ".$needle); } }'
      - name: Validate release metadata consistency
        run: php bin/check-release-metadata.php
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/theme.js
          node --check playwright.config.js
          find tests/browser -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Guard public namespace and language-agnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_files < <(find . -type f \( -name '*.php' -o -name '*.css' -o -name '*.js' -o -name 'theme.json' \) -not -path './.git/*' -not -path './.github/*' -not -path './tests/*')
          if grep -niE 'time2log|t2l-|--t2l-|time2log_|/zh/|/ja/|/en/|pll_current_language|pll_the_languages' "${runtime_files[@]}"; then
            echo 'Site-specific identifiers, locale paths, or required plugin APIs must not ship in Slateframe runtime.' >&2
            exit 1
          fi
      - name: Validate patterns and required files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patterns=(patterns/*.php)
          test "${#patterns[@]}" -ge 18
          for file in "${patterns[@]}"; do
            grep -q '^ \* Title:' "$file"
            grep -q '^ \* Slug: slateframe/' "$file"
            grep -q '^ \* Categories:.*slateframe' "$file"
          done
          if grep -niE 'https?://' "${patterns[@]}"; then
            echo 'Production patterns must not introduce remote media or third-party requests.' >&2
            exit 1
          fi
          for file in style.css assets/css/navigation.css assets/css/comments.css assets/css/content-modes.css index.php functions.php theme.json rtl.css template-parts/content-card.php inc/template-tags.php inc/customizer.php package.json playwright.config.js tests/browser/theme.spec.js tests/browser/appearance.spec.js tests/fixtures/showcase.html phpcs.xml.dist; do test -f "$file"; done
      - name: Enforce asset budgets
        run: |
          wc -c style.css assets/css/navigation.css assets/css/comments.css assets/css/content-modes.css assets/css/editor.css assets/js/theme.js
          test $(wc -c < style.css) -le 20500
          test $(wc -c < assets/css/navigation.css) -le 4000
          test $(wc -c < assets/css/comments.css) -le 3000
          test $(wc -c < assets/css/content-modes.css) -le 12500
          test $(wc -c < assets/css/editor.css) -le 5000
          test $(wc -c < assets/js/theme.js) -le 7000
          base_runtime_bytes=$(( $(wc -c < style.css) + $(wc -c < assets/css/navigation.css) + $(wc -c < assets/js/theme.js) ))
          discussion_runtime_bytes=$(( base_runtime_bytes + $(wc -c < assets/css/comments.css) ))
          contextual_css_bytes=$(( $(wc -c < style.css) + $(wc -c < assets/css/navigation.css) + $(wc -c < assets/css/content-modes.css) ))
          echo "Base CSS+navigation+JS: ${base_runtime_bytes} bytes"
          echo "Base+discussion runtime: ${discussion_runtime_bytes} bytes"
          echo "Base+navigation+contextual CSS: ${contextual_css_bytes} bytes"
          test "$base_runtime_bytes" -le 25000
          test "$discussion_runtime_bytes" -le 28000
          test "$contextual_css_bytes" -le 35000

  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install WPCS and run PHPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress 'wp-coding-standards/wpcs:^3.4'
          "$(composer global config bin-dir --absolute)/phpcs" --standard=phpcs.xml.dist --report=full .



  compatibility:
    name: Compatibility · WP ${{ matrix.wordpress }} · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.7'
            php: '7.4'
          - wordpress: '6.7'
            php: '8.3'
          - wordpress: 'latest'
            php: '7.4'
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      - name: Install WP-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
      - name: Install WordPress and activate Slateframe
        shell: bash
        run: |
          set -euo pipefail
          site="/tmp/wp-compat-${{ matrix.wordpress }}-${{ matrix.php }}"
          mkdir -p "$site"
          wp core download --path="$site" --version="${{ matrix.wordpress }}"
          wp config create --path="$site" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$site" --url=http://127.0.0.1:8080 --title=Slateframe --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" "$site/wp-content/themes/slateframe"
          wp theme activate slateframe --path="$site"
          test "$(wp option get stylesheet --path="$site")" = slateframe
          wp eval 'if ( ! current_theme_supports("title-tag") || ! current_theme_supports("align-wide") ) { throw new RuntimeException("Required theme support missing."); }' --path="$site"

  theme-check:
    name: WordPress.org Theme Check
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Build production theme
        run: ./bin/build-theme-zip.sh /tmp/slateframe-theme-check-dist
      - name: Install WordPress, Theme Check, and run submission checks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p /tmp/wp-theme-check
          wp core download --path=/tmp/wp-theme-check --version=latest
          wp config create --path=/tmp/wp-theme-check --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw --path=/tmp/wp-theme-check
          wp core install --path=/tmp/wp-theme-check --url=http://127.0.0.1:8080 --title=Slateframe --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          unzip -q /tmp/slateframe-theme-check-dist/slateframe.zip -d /tmp/wp-theme-check/wp-content/themes
          wp theme activate slateframe --path=/tmp/wp-theme-check
          wp plugin install theme-check --activate --path=/tmp/wp-theme-check

          set +e
          wp theme-check run slateframe --format=json --path=/tmp/wp-theme-check > /tmp/slateframe-theme-check.json
          theme_check_exit=$?
          set -e
          cat /tmp/slateframe-theme-check.json

          php -r '
            $report = json_decode(file_get_contents("/tmp/slateframe-theme-check.json"), true, 512, JSON_THROW_ON_ERROR);
            $required = array_values(array_filter($report, static fn($item) => ($item["type"] ?? "") === "REQUIRED"));
            if ($required) {
                fwrite(STDERR, "Theme Check REQUIRED findings:\n" . json_encode($required, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
                exit(1);
            }
          '

          if [ "$theme_check_exit" -ne 0 ]; then
            echo "Theme Check reported advisory findings; no REQUIRED findings remain."
          fi
      - name: Upload Theme Check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: slateframe-theme-check
          path: /tmp/slateframe-theme-check.json
          if-no-files-found: ignore
          retention-days: 7

  wordpress-smoke:
    name: WordPress install and activation
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Install WP-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
      - name: Install WordPress and activate Slateframe
        run: |
          mkdir -p /tmp/wp-site
          wp core download --path=/tmp/wp-site --version=latest
          wp config create --path=/tmp/wp-site --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title=Slateframe --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-site/wp-content/themes/slateframe
          wp theme activate slateframe --path=/tmp/wp-site
          test "$(wp option get stylesheet --path=/tmp/wp-site)" = slateframe
          wp eval '$patterns=WP_Block_Patterns_Registry::get_instance(); foreach (["slateframe/photo-essay","slateframe/photography-contact-sheet","slateframe/photography-feature","slateframe/photography-sequence","slateframe/project-case-study","slateframe/portfolio-index","slateframe/project-brief","slateframe/project-outcomes","slateframe/portfolio-project-grid","slateframe/learning-path","slateframe/knowledge-outline","slateframe/lesson-chapter","slateframe/knowledge-definition","slateframe/knowledge-checklist","slateframe/editorial-opening","slateframe/photography-diptych","slateframe/editorial-note","slateframe/reading-list"] as $name) { if (!$patterns->is_registered($name)) { throw new RuntimeException($name); } }' --path=/tmp/wp-site
          wp eval '$styles=WP_Block_Styles_Registry::get_instance(); foreach ([["core/gallery","slateframe-contact-sheet"],["core/gallery","slateframe-diptych"],["core/image","slateframe-photo-feature"],["core/paragraph","slateframe-lead"],["core/list","slateframe-steps"],["core/list","slateframe-checklist"],["core/group","slateframe-key-facts"],["core/group","slateframe-project-brief"],["core/group","slateframe-learning-callout"],["core/group","slateframe-definition"],["core/columns","slateframe-ledger"],["core/columns","slateframe-metrics"]] as $style) { if (!$styles->is_registered($style[0],$style[1])) { throw new RuntimeException($style[0]."/".$style[1]); } }' --path=/tmp/wp-site
      - name: Validate bounded Appearance settings
        shell: bash
        run: |
          wp eval '
            $values = array(
              "slateframe_control_size" => array(20, 44.0),
              "slateframe_spacing_scale" => array(9, 1.2),
              "slateframe_gutter_size" => array(5, 14.0),
              "slateframe_section_scale" => array(9, 1.2),
              "slateframe_radius_size" => array(99, 16.0),
              "slateframe_content_width" => array(400, 640.0),
              "slateframe_wide_width" => array(2000, 1280.0),
            );
            foreach ($values as $id => $fixture) {
              set_theme_mod($id, $fixture[0]);
              if (abs(slateframe_layout_value($id) - $fixture[1]) > 0.0001) {
                throw new RuntimeException("Appearance bound failed: " . $id);
              }
              remove_theme_mod($id);
            }
            if (7 !== count(slateframe_layout_control_definitions())) {
              throw new RuntimeException("Appearance control registry drifted.");
            }
          ' --path=/tmp/wp-site

  browser-smoke:
    name: Browser smoke
    needs: [static]
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixture site
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp && chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p /tmp/wp-browser
          wp core download --path=/tmp/wp-browser --version=latest
          wp config create --path=/tmp/wp-browser --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path=/tmp/wp-browser --url=http://127.0.0.1:8080 --title='Slateframe' --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-browser/wp-content/themes/slateframe
          wp theme activate slateframe --path=/tmp/wp-browser
          wp option update thread_comments 1 --path=/tmp/wp-browser
          mkdir -p /tmp/wp-browser/wp-content/uploads/slateframe-fixtures
          cat > /tmp/wp-browser/wp-content/uploads/slateframe-fixtures/slateframe-landscape.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#dfe6df"/><path d="M0 650L500 260l330 250 230-180 540 420v150H0z" fill="#63756c"/><circle cx="1250" cy="220" r="88" fill="#f7f7f4"/></svg>
          SVG
          cat > /tmp/wp-browser/wp-content/uploads/slateframe-fixtures/slateframe-portrait.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350"><rect width="900" height="1350" fill="#e6e2d8"/><path d="M0 1030L260 530l170 240 180-360 290 520v420H0z" fill="#6e675d"/><circle cx="245" cy="260" r="72" fill="#f7f7f4"/></svg>
          SVG

          cat > /tmp/slateframe-browser-page.html <<'HTML'
          <!-- wp:paragraph {"className":"browser-default-prose"} -->
          <p class="browser-default-prose">Readable measure for Latin, 中文，以及長い日本語の文章。</p>
          <!-- /wp:paragraph -->

          <!-- wp:paragraph {"className":"browser-lead is-style-slateframe-lead"} -->
          <p class="browser-lead is-style-slateframe-lead">A concise editorial lead gives readers the argument before the detail.</p>
          <!-- /wp:paragraph -->

          <!-- wp:html -->
          <nav class="wp-block-table-of-contents browser-toc" aria-label="On this page"><ol><li><a href="#main-content">Overview</a></li><li><a href="#browser-footnote">Notes</a></li></ol></nav>
          <!-- /wp:html -->

          <!-- wp:group {"align":"wide","className":"browser-wide-block"} -->
          <div class="wp-block-group alignwide browser-wide-block"><!-- wp:paragraph -->
          <p>A wide editorial block used to verify that layout can expand beyond the prose measure.</p>
          <!-- /wp:paragraph --></div>
          <!-- /wp:group -->

          <!-- wp:group {"align":"full","className":"browser-full-block"} -->
          <div class="wp-block-group alignfull browser-full-block"><!-- wp:paragraph -->
          <p>A full-width block used to verify the edge-to-edge publishing canvas.</p>
          <!-- /wp:paragraph --></div>
          <!-- /wp:group -->

          <!-- wp:table {"className":"browser-data-table is-style-slateframe-data"} -->
          <figure class="wp-block-table browser-data-table is-style-slateframe-data"><table><thead><tr><th>Metric</th><th>2026</th><th>2027</th></tr></thead><tbody><tr><td>Publishing reach</td><td>1,234</td><td>12,345</td></tr></tbody></table></figure>
          <!-- /wp:table -->

          <!-- wp:details {"className":"browser-details is-style-slateframe-disclosure"} -->
          <details class="wp-block-details browser-details is-style-slateframe-disclosure"><summary>Implementation note</summary><!-- wp:paragraph -->
          <p>Native disclosure content remains readable without JavaScript.</p>
          <!-- /wp:paragraph --></details>
          <!-- /wp:details -->

          <!-- wp:html -->
          <ol class="wp-block-footnotes browser-footnotes"><li id="browser-footnote">Footnote content with a <a href="#main-content">return link</a>.</li></ol>
          <!-- /wp:html -->

          <!-- wp:code -->
          <pre class="wp-block-code"><code>echo "slateframe";</code></pre>
          <!-- /wp:code -->

          <!-- wp:list {"ordered":true,"className":"browser-steps is-style-slateframe-steps"} -->
          <ol class="browser-steps is-style-slateframe-steps"><li>Understand the idea.</li><li>Apply it.</li><li>Extend it.</li></ol>
          <!-- /wp:list -->

          <!-- wp:list {"className":"browser-checklist is-style-slateframe-checklist"} -->
          <ul class="browser-checklist is-style-slateframe-checklist"><li>Keyboard-safe</li><li>Translation-safe</li></ul>
          <!-- /wp:list -->

          <!-- wp:group {"className":"browser-key-facts is-style-slateframe-key-facts"} -->
          <div class="wp-block-group browser-key-facts is-style-slateframe-key-facts"><!-- wp:heading {"level":3} --><h3 class="wp-block-heading">Key facts</h3><!-- /wp:heading --><!-- wp:paragraph --><p>Reusable editorial context.</p><!-- /wp:paragraph --></div>
          <!-- /wp:group -->
          HTML

          PAGE_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=page \
            --post_status=publish \
            --comment_status=open \
            --post_title='Slateframe 发布框架 — Ein außergewöhnlich langes Veröffentlichungsbeispiel' \
            --post_content="$(cat /tmp/slateframe-browser-page.html)" \
            --porcelain)

          CHILD_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=page \
            --post_status=publish \
            --post_parent="$PAGE_ID" \
            --post_title='Nested navigation page' \
            --post_content='<p>Nested fallback navigation fixture.</p>' \
            --porcelain)

          POST_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=post \
            --post_status=publish \
            --comment_status=open \
            --post_title='Slateframe Browser Post' \
            --post_content='<p>Browser smoke content.</p><blockquote><p>Editorial quote.</p></blockquote>' \
            --porcelain)

          for project_index in 1 2 3 4 5 6; do
            wp post create \
              --path=/tmp/wp-browser \
              --post_type=post \
              --post_status=publish \
              --post_title="Portable project fixture ${project_index}" \
              --post_excerpt="A site-neutral project summary for responsive Query Loop coverage." \
              --post_content="<p>Project fixture ${project_index} keeps the theme independent from custom content models.</p>" \
              >/dev/null
          done

          wp comment create \
            --path=/tmp/wp-browser \
            --comment_post_ID="$PAGE_ID" \
            --comment_author='CI Reader' \
            --comment_author_email='ci-reader@example.com' \
            --comment_content='Page comment fixture.' \
            --comment_approved=1

          PHOTO_ID=$(wp post create --path=/tmp/wp-browser --post_type=page --post_status=publish --post_title='Photography Fixture' --post_content='<!-- wp:group {"align":"wide","className":"slateframe-pattern slateframe-photography-feature","layout":{"type":"constrained"}} --><div class="wp-block-group alignwide slateframe-pattern slateframe-photography-feature"><!-- wp:image {"align":"wide","className":"browser-photo-feature is-style-slateframe-photo-feature"} --><figure class="wp-block-image alignwide browser-photo-feature is-style-slateframe-photo-feature"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-landscape.svg" width="1600" height="900" alt="Landscape fixture"><figcaption>Landscape fixture caption</figcaption></figure><!-- /wp:image --><!-- wp:gallery {"align":"wide","className":"browser-photo-gallery is-style-slateframe-contact-sheet"} --><figure class="wp-block-gallery alignwide has-nested-images columns-2 browser-photo-gallery is-style-slateframe-contact-sheet"><!-- wp:image --><figure class="wp-block-image"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-landscape.svg" width="1600" height="900" alt="Wide landscape fixture"><figcaption>Wide frame</figcaption></figure><!-- /wp:image --><!-- wp:image --><figure class="wp-block-image"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-portrait.svg" width="900" height="1350" alt="Tall portrait fixture"><figcaption>Portrait frame</figcaption></figure><!-- /wp:image --></figure><!-- /wp:gallery --></div><!-- /wp:group --><!-- wp:gallery {"align":"wide","className":"browser-photo-diptych is-style-slateframe-diptych"} --><figure class="wp-block-gallery alignwide has-nested-images columns-2 browser-photo-diptych is-style-slateframe-diptych"><!-- wp:image --><figure class="wp-block-image"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-landscape.svg" width="1600" height="900" alt="Diptych landscape"></figure><!-- /wp:image --><!-- wp:image --><figure class="wp-block-image"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-portrait.svg" width="900" height="1350" alt="Diptych portrait"></figure><!-- /wp:image --></figure><!-- /wp:gallery -->' --porcelain)
          PROJECT_ID=$(wp post create --path=/tmp/wp-browser --post_type=page --post_status=publish --post_title='Portfolio Fixture' --post_content='<!-- wp:group {"className":"browser-project-brief is-style-slateframe-project-brief"} --><div class="wp-block-group browser-project-brief is-style-slateframe-project-brief"><!-- wp:paragraph {"className":"slateframe-pattern-kicker"} --><p class="slateframe-pattern-kicker">Project brief</p><!-- /wp:paragraph --><!-- wp:heading {"level":2} --><h2 class="wp-block-heading">A portable project story</h2><!-- /wp:heading --><!-- wp:columns --><div class="wp-block-columns"><!-- wp:column --><div class="wp-block-column"><h3>Context</h3><p>Context for a portable project page.</p></div><!-- /wp:column --><!-- wp:column --><div class="wp-block-column"><h3>Role</h3><p>Role and constraints.</p></div><!-- /wp:column --><!-- wp:column --><div class="wp-block-column"><h3>Outcome</h3><p>Outcome and next step.</p></div><!-- /wp:column --></div><!-- /wp:columns --><p><a href="https://example.com/a-very-long-project-reference-without-site-specific-assumptions-and-with-a-long-readable-path">Long project reference</a></p></div><!-- /wp:group --><!-- wp:columns {"className":"browser-project-metrics is-style-slateframe-metrics"} --><div class="wp-block-columns browser-project-metrics is-style-slateframe-metrics"><!-- wp:column --><div class="wp-block-column"><h3>Reach</h3><p>12 markets</p></div><!-- /wp:column --><!-- wp:column --><div class="wp-block-column"><h3>Latency</h3><p>−38%</p></div><!-- /wp:column --><!-- wp:column --><div class="wp-block-column"><h3>Status</h3><p>Maintained</p></div><!-- /wp:column --></div><!-- /wp:columns -->' --porcelain)
          SHOWCASE_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=page \
            --post_status=publish \
            --post_title='A clean frame for whatever you publish' \
            --post_content="$(cat "$GITHUB_WORKSPACE/tests/fixtures/showcase.html")" \
            --porcelain)

          KNOWLEDGE_ID=$(wp post create --path=/tmp/wp-browser --post_type=page --post_status=publish --post_title='Knowledge Fixture — 中文とالعربية long-string validation' --post_content='<!-- wp:group {"className":"browser-learning-callout is-style-slateframe-learning-callout"} --><div class="wp-block-group browser-learning-callout is-style-slateframe-learning-callout" dir="rtl"><h2>مسار تعلم مرن</h2><p>هذا مثال طويل لاختبار اتجاه الكتابة والتخطيط المنطقي دون افتراض لغة أو إضافة متعددة اللغات.</p></div><!-- /wp:group --><!-- wp:list {"ordered":true,"className":"browser-rtl-steps is-style-slateframe-steps"} --><ol class="browser-rtl-steps is-style-slateframe-steps" dir="rtl"><li>افهم الفكرة الأساسية.</li><li>طبّقها على مثال عملي.</li><li>اربط النتيجة بالخطوة التالية.</li></ol><!-- /wp:list --><!-- wp:group {"className":"browser-definition is-style-slateframe-definition"} --><div class="wp-block-group browser-definition is-style-slateframe-definition" dir="rtl"><h3>Definition</h3><p>A concise term explanation that stays in normal document flow.</p></div><!-- /wp:group -->' --porcelain)

          echo "SLATEFRAME_SHOWCASE_PATH=/?page_id=$SHOWCASE_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_PHOTO_PATH=/?page_id=$PHOTO_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_PROJECT_PATH=/?page_id=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_KNOWLEDGE_PATH=/?page_id=$KNOWLEDGE_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_PAGE_PATH=/?page_id=$PAGE_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_POST_PATH=/?p=$POST_ID" >> "$GITHUB_ENV"
      - name: Install Playwright and start WordPress
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npx playwright install --with-deps chromium
          wp server --path=/tmp/wp-browser --host=127.0.0.1 --port=8080 >/tmp/slateframe-server.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
      - name: Run responsive browser smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        run: npm run test:browser
      - name: Verify compact Appearance bounds
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          SLATEFRAME_APPEARANCE_PROFILE: compact
        run: |
          wp theme mod set slateframe_control_size 44 --path=/tmp/wp-browser
          wp theme mod set slateframe_spacing_scale 0.9 --path=/tmp/wp-browser
          wp theme mod set slateframe_gutter_size 14 --path=/tmp/wp-browser
          wp theme mod set slateframe_section_scale 0.85 --path=/tmp/wp-browser
          wp theme mod set slateframe_radius_size 0 --path=/tmp/wp-browser
          wp theme mod set slateframe_content_width 640 --path=/tmp/wp-browser
          wp theme mod set slateframe_wide_width 1024 --path=/tmp/wp-browser
          npx playwright test tests/browser/appearance.spec.js --project=viewport-390 --project=viewport-1440
      - name: Verify spacious Appearance bounds
        if: ${{ always() }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          SLATEFRAME_APPEARANCE_PROFILE: spacious
        run: |
          wp theme mod set slateframe_control_size 56 --path=/tmp/wp-browser
          wp theme mod set slateframe_spacing_scale 1.2 --path=/tmp/wp-browser
          wp theme mod set slateframe_gutter_size 28 --path=/tmp/wp-browser
          wp theme mod set slateframe_section_scale 1.2 --path=/tmp/wp-browser
          wp theme mod set slateframe_radius_size 16 --path=/tmp/wp-browser
          wp theme mod set slateframe_content_width 800 --path=/tmp/wp-browser
          wp theme mod set slateframe_wide_width 1280 --path=/tmp/wp-browser
          npx playwright test tests/browser/appearance.spec.js --project=viewport-390 --project=viewport-1440
      - name: Reset Appearance fixture
        if: ${{ always() }}
        run: |
          for mod in slateframe_control_size slateframe_spacing_scale slateframe_gutter_size slateframe_section_scale slateframe_radius_size slateframe_content_width slateframe_wide_width; do
            wp theme mod remove "$mod" --path=/tmp/wp-browser
          done
      - name: Upload browser artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: slateframe-browser
          path: |
            test-artifacts/screenshots/
            playwright-report/
            test-results/
            /tmp/slateframe-server.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build distributable
    needs: [static, coding-standards, compatibility, theme-check, wordpress-smoke, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          php bin/check-release-metadata.php
          ./bin/build-theme-zip.sh
          unzip -Z1 dist/slateframe.zip > /tmp/package.txt
          grep -qx 'slateframe/style.css' /tmp/package.txt
          grep -qx 'slateframe/functions.php' /tmp/package.txt
          grep -qx 'slateframe/theme.json' /tmp/package.txt
          grep -qx 'slateframe/screenshot.png' /tmp/package.txt
          php -r '$size=getimagesize("dist/slateframe/screenshot.png"); if (!$size || $size[0] !== 1200 || $size[1] !== 900) { throw new RuntimeException("screenshot.png must be 1200x900"); }'
          if grep -Eq '^slateframe/(README\.md|package(-lock)?\.json|playwright\.config\.js|phpcs\.xml\.dist)$' /tmp/package.txt; then exit 1; fi
          if grep -E '^slateframe/(\.git|\.github|docs|bin|dist|node_modules|tests|test-artifacts|playwright-report|test-results)/' /tmp/package.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: slateframe-theme
          path: dist/slateframe.zip
          retention-days: 7
