              --post_content="<p>slateframe-project-fixture-token Project fixture ${project_index} keeps the theme independent from custom content models.</p>" \
              --porcelain)
            if [ "$project_index" -ne 7 ]; then
              if [ "$((project_index % 2))" -eq 0 ]; then
                project_media_id="$PROJECT_PORTRAIT_ID"
              else
                project_media_id="$PROJECT_THUMBNAIL_ID"
              fi
              wp post meta update "$PROJECT_POST_ID" _thumbnail_id "$project_media_id" --path=/tmp/wp-browser >/dev/null
            fi
          done

          UNTITLED_POST_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=post \
            --post_status=publish \
            --post_author=1 \
            --post_date='2000-01-01 00:00:00' \
            --post_title='' \
            --post_content='<p>slateframe-untitled-fixture-token keeps untitled content discoverable.</p>' \
            --porcelain)

          PARENT_COMMENT_ID=$(wp comment create \
            --path=/tmp/wp-browser \
            --comment_post_ID="$PAGE_ID" \
            --comment_author='CI Reader' \
            --comment_author_email='ci-reader@example.com' \
            --comment_content='Page comment fixture.' \
            --comment_approved=1 \
            --porcelain)
          wp comment create \
            --path=/tmp/wp-browser \
            --comment_post_ID="$PAGE_ID" \
            --comment_parent="$PARENT_COMMENT_ID" \
            --comment_author='Nested Reader' \
            --comment_author_email='nested-reader@example.com' \
            --comment_content='Nested reply fixture — 中文 العربية.' \
            --comment_approved=1

          PHOTO_ID=$(wp post create --path=/tmp/wp-browser --post_type=page --post_status=publish --post_title='Photography Fixture' --post_content='<!-- wp:group {"align":"wide","className":"slateframe-pattern slateframe-photography-feature","layout":{"type":"constrained"}} --><div class="wp-block-group alignwide slateframe-pattern slateframe-photography-feature"><!-- wp:image {"align":"wide","lightbox":{"enabled":true},"className":"browser-photo-feature is-style-slateframe-photo-feature"} --><figure class="wp-block-image alignwide browser-photo-feature is-style-slateframe-photo-feature"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-landscape.svg" width="1600" height="900" alt="Landscape fixture"><figcaption>Landscape fixture caption</figcaption></figure><!-- /wp:image --><!-- wp:gallery {"align":"wide","className":"browser-photo-gallery is-style-slateframe-contact-sheet"} --><figure class="wp-block-gallery alignwide has-nested-images columns-2 browser-photo-gallery is-style-slateframe-contact-sheet"><!-- wp:image --><figure class="wp-block-image"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-landscape.svg" width="1600" height="900" alt="Wide landscape fixture"><figcaption>Wide frame</figcaption></figure><!-- /wp:image --><!-- wp:image --><figure class="wp-block-image"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-portrait.svg" width="900" height="1350" alt="Tall portrait fixture"><figcaption>Portrait frame</figcaption></figure><!-- /wp:image --></figure><!-- /wp:gallery --></div><!-- /wp:group --><!-- wp:gallery {"align":"wide","className":"browser-photo-diptych is-style-slateframe-diptych"} --><figure class="wp-block-gallery alignwide has-nested-images columns-2 browser-photo-diptych is-style-slateframe-diptych"><!-- wp:image --><figure class="wp-block-image"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-landscape.svg" width="1600" height="900" alt="Diptych landscape"><figcaption>Diptych landscape caption</figcaption></figure><!-- /wp:image --><!-- wp:image --><figure class="wp-block-image"><img src="/wp-content/uploads/slateframe-fixtures/slateframe-portrait.svg" width="900" height="1350" alt="Diptych portrait"><figcaption>Diptych portrait caption — 中文 日本語 العربية</figcaption></figure><!-- /wp:image --></figure><!-- /wp:gallery -->' --porcelain)
          EDITORIAL_PATHWAYS_ID=$(wp eval '
          $pattern = WP_Block_Patterns_Registry::get_instance()->get_registered("slateframe/editorial-pathways");
          if (!$pattern || empty($pattern["content"])) { throw new RuntimeException("Missing registered Editorial Pathways pattern"); }
          $id = wp_insert_post(array("post_type" => "page", "post_status" => "publish", "post_title" => "Editorial pathways fixture", "post_content" => $pattern["content"]), true);
          if (is_wp_error($id)) { throw new RuntimeException($id->get_error_message()); }
          echo $id;
          ' --path=/tmp/wp-browser)
          PROJECT_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=page \
            --post_status=publish \
            --post_title='Portfolio Fixture' \
            --post_content="$(cat "$GITHUB_WORKSPACE/tests/fixtures/portfolio-query.html")" \
            --porcelain)
          SHOWCASE_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=page \
            --post_status=publish \
            --post_title='A clean frame for whatever you publish' \
            --post_content="$(cat "$GITHUB_WORKSPACE/tests/fixtures/showcase.html")" \
            --porcelain)

          KNOWLEDGE_ID=$(wp post create --path=/tmp/wp-browser --post_type=page --post_status=publish --post_title='Knowledge Fixture — 中文とالعربية long-string validation' --post_content='<!-- wp:group {"className":"browser-learning-callout is-style-slateframe-learning-callout"} --><div class="wp-block-group browser-learning-callout is-style-slateframe-learning-callout" dir="rtl"><h2>مسار تعلم مرن</h2><p>هذا مثال طويل لاختبار اتجاه الكتابة والتخطيط المنطقي دون افتراض لغة أو إضافة متعددة اللغات.</p></div><!-- /wp:group --><!-- wp:list {"ordered":true,"className":"browser-rtl-steps is-style-slateframe-steps"} --><ol class="browser-rtl-steps is-style-slateframe-steps" dir="rtl"><li>افهم الفكرة الأساسية.</li><li>طبّقها على مثال عملي.</li><li>اربط النتيجة بالخطوة التالية.</li></ol><!-- /wp:list --><!-- wp:group {"className":"browser-definition is-style-slateframe-definition"} --><div class="wp-block-group browser-definition is-style-slateframe-definition" dir="rtl"><h3>Definition</h3><p>A concise term explanation that stays in normal document flow.</p></div><!-- /wp:group -->' --porcelain)
          EMPTY_AUTHOR_ID=$(wp user create empty-author empty-author@example.com --role=subscriber --display_name='Empty Author' --porcelain --path=/tmp/wp-browser)


          echo "SLATEFRAME_SHOWCASE_PATH=/?page_id=$SHOWCASE_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_FEATURED_PAGE_PATH=/?page_id=$FEATURED_PAGE_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_ATTACHMENT_PATH=/?attachment_id=$PROJECT_THUMBNAIL_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_UNTITLED_POST_PATH=/?p=$UNTITLED_POST_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_PHOTO_PATH=/?page_id=$PHOTO_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_PROJECT_PATH=/?page_id=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_EDITORIAL_PATHWAYS_PATH=/?page_id=$EDITORIAL_PATHWAYS_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_KNOWLEDGE_PATH=/?page_id=$KNOWLEDGE_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_PAGE_PATH=/?page_id=$PAGE_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_EDITOR_POST_ID=$EDITOR_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_POST_PATH=/?p=$POST_ID" >> "$GITHUB_ENV"
          # Exercise Core's native password prompt without altering normal recent-post fixtures.
          PROTECTED_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=post \
            --post_status=publish \
            --post_date='1990-01-01 00:00:00' \
            --comment_status=open \
            --post_password='slateframe-ci' \
            --post_title='Protected Core fixture' \
            --post_content='Private fixture content — not rendered without password' \
            --porcelain)
          echo "SLATEFRAME_PROTECTED_POST_PATH=/?p=$PROTECTED_ID" >> "$GITHUB_ENV"

          # A second protected post exercises authored contextual assets without
          # changing the normal WordPress browser fixtures.
          PROTECTED_PRESENTATION_ID=$(wp post create \
            --path=/tmp/wp-browser \
            --post_type=post \
            --post_status=publish \
            --post_date='1990-01-02 00:00:00' \
            --comment_status=closed \
            --post_password='slateframe-ci-presentation' \
            --post_title='Protected presentation fixture' \
            --post_content='<!-- wp:html --><div class="slateframe-gallery-sequence slateframe-project-grid"><form action="#" method="get"><label for="visual-fixture">Private visual fixture — hidden until unlocked</label><input id="visual-fixture" name="v"></form></div><!-- /wp:html -->' \
            --porcelain)
          echo "SLATEFRAME_PROTECTED_PRESENTATION_PATH=/?p=$PROTECTED_PRESENTATION_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_MULTIPAGE_POST_PATH=/?p=$MULTIPAGE_POST_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_MULTIPAGE_PAGE_PATH=/?page_id=$MULTIPAGE_PAGE_ID" >> "$GITHUB_ENV"
          echo "SLATEFRAME_EMPTY_AUTHOR_PATH=/?author=$EMPTY_AUTHOR_ID" >> "$GITHUB_ENV"
      - name: Install Playwright and start WordPress
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npx playwright install --with-deps chromium
          wp server --path=/tmp/wp-browser --host=127.0.0.1 --port=8080 >/tmp/slateframe-server.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
      - name: Run responsive browser smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
        shell: bash
        run: |
          set -euo pipefail
          # Test workers share one real WordPress database. WP-CLI fixture writers
          # must not overlap each other or read-only stylesheet assertions.
          readonly_specs=()
          stateful_specs=()
          authenticated_specs=()
          for spec in tests/browser/*.spec.js; do
            if grep -Eq 'execFileSync|execSync|spawnSync' "$spec"; then
              stateful_specs+=("$spec")
            elif grep -Eq 'openAuthenticatedEditor|support/editor-login' "$spec"; then
              # Login POSTs mutate WordPress session state; isolate them from
              # parallel readers and fixture writers without skipping assertions.
              authenticated_specs+=("$spec")
            else
              readonly_specs+=("$spec")
            fi
          done
          test "${#readonly_specs[@]}" -gt 0
          test "${#stateful_specs[@]}" -gt 0
          test "${#authenticated_specs[@]}" -gt 0
          printf 'Parallel read-only: %s; isolated WP fixture: %s; isolated Gutenberg login: %s\\n' "${#readonly_specs[@]}" "${#stateful_specs[@]}" "${#authenticated_specs[@]}"
          # Preserve failure traces before a later suite clears test-results.
          trap 'status=$?; if [ "$status" -ne 0 ] && [ -d test-results ]; then mkdir -p test-artifacts/browser-failure; cp -a test-results test-artifacts/browser-failure/responsive; fi' EXIT
          npx playwright test "${readonly_specs[@]}"
          npx playwright test "${stateful_specs[@]}" --workers=1
          npx playwright test "${authenticated_specs[@]}" --workers=1
      - name: Verify compact Appearance bounds
        if: ${{ always() }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          SLATEFRAME_APPEARANCE_PROFILE: compact
        run: |
          wp theme mod set slateframe_control_size 44 --path=/tmp/wp-browser
          wp theme mod set slateframe_spacing_scale 0.9 --path=/tmp/wp-browser
          wp theme mod set slateframe_gutter_size 14 --path=/tmp/wp-browser
          wp theme mod set slateframe_section_scale 0.85 --path=/tmp/wp-browser
          wp theme mod set slateframe_radius_size 0 --path=/tmp/wp-browser
          wp theme mod set slateframe_content_width 640 --path=/tmp/wp-browser
          wp theme mod set slateframe_wide_width 1024 --path=/tmp/wp-browser
          npx playwright test tests/browser/appearance.spec.js --project=viewport-390 --project=viewport-1440
          npx playwright test tests/browser/appearance-breakpoint-matrix.spec.js
      - name: Verify spacious Appearance bounds
        if: ${{ always() }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          SLATEFRAME_APPEARANCE_PROFILE: spacious
        run: |
          wp theme mod set slateframe_control_size 56 --path=/tmp/wp-browser
          wp theme mod set slateframe_spacing_scale 1.2 --path=/tmp/wp-browser
          wp theme mod set slateframe_gutter_size 28 --path=/tmp/wp-browser
          wp theme mod set slateframe_section_scale 1.2 --path=/tmp/wp-browser
          wp theme mod set slateframe_radius_size 16 --path=/tmp/wp-browser
          wp theme mod set slateframe_content_width 800 --path=/tmp/wp-browser
          wp theme mod set slateframe_wide_width 1280 --path=/tmp/wp-browser
          npx playwright test tests/browser/appearance.spec.js --project=viewport-390 --project=viewport-1440
          npx playwright test tests/browser/appearance-breakpoint-matrix.spec.js
      - name: Reset Appearance fixture
        if: ${{ always() }}
        run: |
          for mod in slateframe_control_size slateframe_spacing_scale slateframe_gutter_size slateframe_section_scale slateframe_radius_size slateframe_content_width slateframe_wide_width; do
            wp theme mod remove "$mod" --path=/tmp/wp-browser
          done
      - name: Verify explicit dark site mode
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          SLATEFRAME_SITE_COLOR_MODE: dark
        run: |
          wp theme mod set slateframe_color_mode dark --path=/tmp/wp-browser
          npx playwright test tests/browser/color-mode.spec.js --project=viewport-390 --project=viewport-1440
      - name: Verify explicit light site mode
        if: ${{ always() }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          SLATEFRAME_SITE_COLOR_MODE: light
        run: |
          wp theme mod set slateframe_color_mode light --path=/tmp/wp-browser
          npx playwright test tests/browser/color-mode.spec.js --project=viewport-390 --project=viewport-1440
      - name: Reset color-mode fixture
        if: ${{ always() }}
        run: wp theme mod remove slateframe_color_mode --path=/tmp/wp-browser
      - name: Require complete visual evidence
        env:
          SLATEFRAME_EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SLATEFRAME_EVIDENCE_SHA" || { echo "Browser evidence does not match PR HEAD" >&2; exit 1; }
          printf "%s\n" "$SLATEFRAME_EVIDENCE_SHA" > test-artifacts/screenshots/HEAD_SHA.txt
          # Keep both listing and numeric metadata RTL/CJK visual contracts mandatory.
          # These files are captured by real WordPress/Chromium Playwright, never mock DOM.
          for screenshot in \
            listing-bidi-index-390-rtl-400.png \
            listing-bidi-index-390-rtl-400-forced-colors.png \
            listing-bidi-index-1440-ltr.png \
            listing-bidi-author-390-rtl-400.png \
            listing-bidi-author-390-rtl-400-forced-colors.png \
            listing-bidi-author-1440-ltr.png \
            listing-bidi-core-archive-390-rtl-400.png \
            listing-bidi-core-archive-1440-ltr.png \
            numeric-metadata-listing-390-rtl-400.png \
            numeric-metadata-listing-390-rtl-400-forced-colors.png \
            numeric-metadata-listing-1440-ltr.png \
            numeric-metadata-article-390-rtl-400.png \
            numeric-metadata-article-390-rtl-400-forced-colors.png \
            numeric-metadata-article-1440-ltr.png; do
            test -s "test-artifacts/screenshots/$screenshot" || { echo "Missing RTL/CJK listing/metadata evidence: $screenshot" >&2; exit 1; }
          done
          # Require three-level Core Walker navigation evidence across responsive RTL/LTR states.
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/navigation-deep-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing native deep-navigation evidence: $screenshot" >&2; exit 1; }
            done
          done
          test -s test-artifacts/screenshots/navigation-deep-390-rtl-forced-colors.png || { echo "Missing deep-navigation forced-colors evidence" >&2; exit 1; }
          # Native Core footer menu hierarchy must remain visible at high zoom and forced colors.
          for screenshot in footer-nested-390-rtl-400.png footer-nested-390-rtl-400-forced-colors.png footer-nested-1440-ltr.png; do
            test -s "test-artifacts/screenshots/$screenshot" || { echo "Missing nested Core footer evidence: $screenshot" >&2; exit 1; }
          done
          # Core-authored pages must show one native form, not a duplicate classic form.
          for screenshot in page-comments-core-390-rtl-400.png page-comments-core-390-rtl-400-forced-colors.png page-comments-core-1440-ltr.png page-comments-classic-390-rtl.png; do
            test -s "test-artifacts/screenshots/$screenshot" || { echo "Missing page discussion evidence: $screenshot" >&2; exit 1; }
          done
          # Core-authored attachment comments must not duplicate the classic form.
          for screenshot in attachment-comments-core-390-rtl-400.png attachment-comments-core-390-rtl-400-forced-colors.png attachment-comments-core-1440-ltr.png attachment-comments-classic-390-rtl.png; do
            test -s "test-artifacts/screenshots/$screenshot" || { echo "Missing attachment discussion evidence: $screenshot" >&2; exit 1; }
          done
          # Closed classic attachments must retain history without a submit form.
          for screenshot in attachment-comments-closed-390-rtl-400.png attachment-comments-closed-390-rtl-400-forced-colors.png attachment-comments-closed-1440-ltr.png; do
            test -s "test-artifacts/screenshots/$screenshot" || { echo "Missing closed attachment history evidence: $screenshot" >&2; exit 1; }
          done
          # Published synced Core discussion must not duplicate classic forms on any singular template.
          for screenshot in synced-comments-post-390-rtl-400.png synced-comments-post-1440-ltr.png synced-comments-page-390-rtl-400.png synced-comments-page-1440-ltr.png synced-comments-attachment-390-rtl-400.png synced-comments-attachment-1440-ltr.png synced-comments-attachment-390-rtl-400-forced-colors.png; do
            test -s "test-artifacts/screenshots/$screenshot" || { echo "Missing synced Core discussion evidence: $screenshot" >&2; exit 1; }
          done
          # Core Query Loop Post Template comments belong to repeated posts, not the outer singular.
          for screenshot in comments-query-query-only-390-rtl-400.png comments-query-query-only-1440-ltr.png comments-query-synced-query-only-390-rtl-400.png comments-query-synced-query-only-1440-ltr.png comments-query-query-with-own-390-rtl-400.png comments-query-query-with-own-1440-ltr.png comments-query-query-with-result-390-rtl-400.png comments-query-query-with-result-1440-ltr.png comments-query-query-only-390-rtl-400-forced-colors.png comments-query-collision-390-rtl-400.png; do
            test -s "test-artifacts/screenshots/$screenshot" || { echo "Missing Query Loop discussion ownership evidence: $screenshot" >&2; exit 1; }
          done
          # Require real Gutenberg Core Tabs 400% RTL editor screenshots at both widths.
          for width in 390 1440; do
            test -s "test-artifacts/screenshots/core-tabs-editor-${width}-rtl-400.png" || { echo "Missing native Gutenberg Core Tabs 400% editor evidence: ${width}" >&2; exit 1; }
            test -s "test-artifacts/screenshots/core-tabs-editor-${width}-rtl-400-complete-label.png" || { echo "Missing complete native Gutenberg Core Tabs 400% label evidence: ${width}" >&2; exit 1; }
          done
          test -s test-artifacts/screenshots/core-tabs-editor-390-rtl-400-forced-colors.png || { echo "Missing native Gutenberg Core Tabs forced-colors editor evidence" >&2; exit 1; }
          test -s test-artifacts/screenshots/core-tabs-editor-390-rtl-400-complete-label-forced-colors.png || { echo "Missing complete native Gutenberg Core Tabs forced-colors label evidence" >&2; exit 1; }
          for screenshot in knowledge-native-start-390-rtl-400.png knowledge-native-start-1440-ltr.png knowledge-native-start-390-rtl-400-forced-colors.png; do
            test -s "test-artifacts/screenshots/$screenshot" || { echo "Missing native authored Steps evidence: $screenshot" >&2; exit 1; }
          done
          for width in 390 1440; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/core-photography-sequence-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing registered Photography sequence evidence: $screenshot" >&2; exit 1; }
            done
          done
          test -s test-artifacts/screenshots/core-photography-sequence-390-rtl-200-forced-colors.png || { echo "Missing Photography sequence forced-colors evidence" >&2; exit 1; }
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/core-post-author-name-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing native author evidence: $screenshot" >&2; exit 1; }
            done
          done
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/core-post-comments-count-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing native Comments Count evidence: $screenshot" >&2; exit 1; }
            done
          done
          test -s test-artifacts/screenshots/core-post-comments-count-390-rtl-200-forced-colors.png || { echo "Missing Comments Count forced-colors evidence" >&2; exit 1; }
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/core-post-comments-link-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing native Comments Link evidence: $screenshot" >&2; exit 1; }
            done
          done
          test -s test-artifacts/screenshots/core-post-comments-link-390-rtl-200-forced-colors.png || { echo "Missing Comments Link forced-colors evidence" >&2; exit 1; }
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              for feature in comments-title post-comments-form; do
                screenshot="test-artifacts/screenshots/core-${feature}-${width}-${direction}.png"
                test -s "$screenshot" || { echo "Missing native discussion evidence: $screenshot" >&2; exit 1; }
              done
            done
          done
          for feature in comments-title post-comments-form; do
            screenshot="test-artifacts/screenshots/core-${feature}-390-rtl-200-forced-colors.png"
            test -s "$screenshot" || { echo "Missing discussion forced-colors evidence: $screenshot" >&2; exit 1; }
          done
          test -s test-artifacts/screenshots/core-post-author-name-390-rtl-200-forced-colors.png || { echo "Missing author forced-colors evidence" >&2; exit 1; }
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/core-site-title-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing Site Title evidence: $screenshot" >&2; exit 1; }
            done
          done
          test -s test-artifacts/screenshots/core-site-title-390-rtl-200-forced-colors.png || { echo "Missing Site Title forced-colors evidence" >&2; exit 1; }
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/core-site-tagline-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing Site Tagline evidence: $screenshot" >&2; exit 1; }
            done
          done
          test -s test-artifacts/screenshots/core-site-tagline-390-rtl-200-forced-colors.png || { echo "Missing Site Tagline forced-colors evidence" >&2; exit 1; }
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/core-columns-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing native Columns evidence: $screenshot" >&2; exit 1; }
            done
          done
          test -s test-artifacts/screenshots/core-columns-390-rtl-200-forced-colors.png || { echo "Missing native Columns forced-colors evidence" >&2; exit 1; }
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/core-group-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing native Group evidence: $screenshot" >&2; exit 1; }
            done
          done
          test -s test-artifacts/screenshots/core-group-390-rtl-200-forced-colors.png || { echo "Missing native Group forced-colors evidence" >&2; exit 1; }
          for width in 320 375 390 412 768 1440 1920; do
            for direction in ltr rtl; do
              screenshot="test-artifacts/screenshots/core-details-parity-${width}-${direction}.png"
              test -s "$screenshot" || { echo "Missing native Details evidence: $screenshot" >&2; exit 1; }
