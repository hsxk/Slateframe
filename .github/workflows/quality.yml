          python3 tests/verify_skip_link_zoom_evidence.py test-artifacts/screenshots
          python3 bin/check-screenshot.py test-artifacts/screenshots/wordpress-org-screenshot-candidate.png
          python3 tests/verify_footnotes_screenshots.py test-artifacts/screenshots "$SLATEFRAME_EVIDENCE_SHA"
          python3 tests/verify_browser_inventory.py generate
          python3 tests/verify_browser_inventory.py verify
          python3 bin/check-visual-coverage.py --manifest test-artifacts/screenshots/BROWSER_SCREENSHOT_INVENTORY.json --head "$SLATEFRAME_EVIDENCE_SHA"
      - name: Generate exact-HEAD browser visual review
        env:
          SLATEFRAME_EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SLATEFRAME_EVIDENCE_SHA"
          python3 bin/visual-review-index.py test-artifacts/screenshots "$SLATEFRAME_EVIDENCE_SHA" --output test-artifacts/browser-review.html --require-cross-page
          test -s test-artifacts/browser-review.html
      - name: Upload browser artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: slateframe-browser
          path: |
            test-artifacts/screenshots/
            test-artifacts/browser-review.html
            test-artifacts/browser-failure/
            playwright-report/
            test-results/
            /tmp/slateframe-server.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build distributable
    needs: [static, coding-standards, compatibility, theme-check, wordpress-smoke, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and validate theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          php bin/check-release-metadata.php
          ./bin/build-theme-zip.sh
          python3 bin/check-distribution-boundary.py dist/slateframe.zip
          first_sha="$(sha256sum dist/slateframe.zip | cut -d' ' -f1)"
          ./bin/build-theme-zip.sh /tmp/slateframe-reproducible
          second_sha="$(sha256sum /tmp/slateframe-reproducible/slateframe.zip | cut -d' ' -f1)"
          test "$first_sha" = "$second_sha"
          echo "Reproducible ZIP SHA256: $first_sha"
          unzip -Z1 dist/slateframe.zip > /tmp/package.txt
          grep -qx 'slateframe/style.css' /tmp/package.txt
          grep -qx 'slateframe/functions.php' /tmp/package.txt
          grep -qx 'slateframe/theme.json' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-separator.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-quote.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-pullquote.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-post-comments-link.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-comments-title.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-comments-thread.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-post-comments-count.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-query-no-results.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-image.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-table.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-heading.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-paragraph.css' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-list.css' /tmp/package.txt
          grep -qx 'slateframe/inc/core-list.php' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-verse.css' /tmp/package.txt
          grep -qx 'slateframe/inc/core-verse.php' /tmp/package.txt
          grep -qx 'slateframe/assets/css/core-post-comments-form.css' /tmp/package.txt
           grep -qx 'slateframe/assets/css/core-file.css' /tmp/package.txt
          grep -qx 'slateframe/screenshot.png' /tmp/package.txt
          python3 bin/check-screenshot.py dist/slateframe/screenshot.png
          if grep -qx "slateframe/.distignore" /tmp/package.txt; then echo "Packaging manifest leaked into theme ZIP" >&2; exit 1; fi
          if grep -Eq '^slateframe/(README\.md|package(-lock)?\.json|playwright\.config\.js|phpcs\.xml\.dist)$' /tmp/package.txt; then exit 1; fi
          if grep -E '^slateframe/(\.git|\.github|docs|bin|dist|node_modules|tests|test-artifacts|playwright-report|test-results)/' /tmp/package.txt; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: slateframe-theme
          path: dist/slateframe.zip
          retention-days: 7
