          wp core install --path=/tmp/wp-site --url=http://127.0.0.1:8080 --title=Slateframe --admin_user=admin --admin_password=ci-password --admin_email=ci@example.com --skip-email
          ln -s "$GITHUB_WORKSPACE" /tmp/wp-site/wp-content/themes/slateframe
          wp theme activate slateframe --path=/tmp/wp-site
          test "$(wp option get stylesheet --path=/tmp/wp-site)" = slateframe
          wp eval-file "$GITHUB_WORKSPACE/bin/check-pattern-runtime.php" --path=/tmp/wp-site
          wp eval '$styles=WP_Block_Styles_Registry::get_instance(); foreach ([["core/gallery","slateframe-contact-sheet"],["core/gallery","slateframe-diptych"],["core/image","slateframe-photo-feature"],["core/paragraph","slateframe-lead"],["core/list","slateframe-steps"],["core/list","slateframe-checklist"],["core/group","slateframe-key-facts"],["core/group","slateframe-project-brief"],["core/group","slateframe-learning-callout"],["core/group","slateframe-definition"],["core/columns","slateframe-ledger"],["core/columns","slateframe-metrics"]] as $style) { if (!$styles->is_registered($style[0],$style[1])) { throw new RuntimeException($style[0]."/".$style[1]); } }' --path=/tmp/wp-site
          wp eval 'if (!current_theme_supports("editor-styles")) { throw new RuntimeException("Editor styles support missing."); } global $editor_styles; foreach (["style.css","assets/css/core-buttons.css","assets/css/core-list.css","assets/css/forms.css","assets/css/form-content.css","assets/css/reading.css","assets/css/photography.css","assets/css/content-modes.css","assets/css/query-loop.css","assets/css/editor.css"] as $asset) { if (!in_array($asset, (array) $editor_styles, true)) { throw new RuntimeException("Editor stylesheet missing: " . $asset); } }' --path=/tmp/wp-site
      - name: Validate bounded Appearance settings
        shell: bash
        run: |
          wp eval '
            $values = array(
              "slateframe_control_size" => array(20, 44.0),
              "slateframe_spacing_scale" => array(9, 1.2),
              "slateframe_gutter_size" => array(5, 14.0),
              "slateframe_section_scale" => array(9, 1.2),
              "slateframe_radius_size" => array(99, 16.0),
              "slateframe_content_width" => array(400, 640.0),
              "slateframe_wide_width" => array(2000, 1280.0),
            );
            foreach ($values as $id => $fixture) {
              set_theme_mod($id, $fixture[0]);
